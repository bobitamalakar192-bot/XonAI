<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — XonAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050914;--blue:#2F80FF;--violet:#7B5CFF;--cyan:#29D9FF;--text:#EAF0FF;--muted:#9AA7C7;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--grad:linear-gradient(135deg,#22d3ee,#2F80FF,#7B5CFF)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#04060f;color:var(--text);min-height:100dvh;display:flex;overflow-x:hidden}
.left{flex:0 0 45%;display:flex;flex-direction:column;justify-content:space-between;padding:40px;position:relative;overflow:hidden;background:linear-gradient(160deg,#070b18,#0c1024)}
.left::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(47,128,255,.25),transparent 65%);top:-100px;left:-100px;filter:blur(60px)}
.left::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(123,92,255,.2),transparent 65%);bottom:-80px;right:-60px;filter:blur(60px)}
.llogo{font-family:'Space Grotesk';font-weight:700;font-size:1.4rem;display:flex;align-items:center;gap:10px;z-index:2}
.llogo .ic{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px rgba(79,124,255,.55)}
.lcenter{z-index:2;text-align:center}
.orbmini{width:140px;height:140px;margin:0 auto 30px;border-radius:50%;position:relative}
.orbmini .o{position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,rgba(41,217,255,.85) 16%,rgba(47,128,255,.6) 45%,rgba(123,92,255,.4) 70%,rgba(8,12,26,.95));box-shadow:0 0 60px rgba(47,128,255,.6);animation:fl 5s ease-in-out infinite}
.orbmini .r{position:absolute;border-radius:50%;border:1px solid rgba(120,160,255,.35)}
.r1{inset:0;animation:sp 12s linear infinite;border-top-color:var(--cyan)}
.r2{inset:-14px;animation:sp 20s linear infinite reverse;border-top-color:var(--violet)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes sp{to{transform:rotate(360deg)}}
.lcenter h2{font-family:'Space Grotesk';font-size:1.6rem;line-height:1.3}
.lcenter h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lcenter p{color:var(--muted);font-size:.9rem;margin-top:12px}
.lfoot{z-index:2;display:flex;gap:30px;color:var(--muted);font-size:.8rem}
.lfoot b{color:var(--cyan)}
.right{flex:1;display:grid;place-items:center;padding:40px 20px}
.fcard{width:100%;max-width:420px}
.fcard h1{font-family:'Space Grotesk';font-size:1.9rem;margin-bottom:6px}
.fcard .sub{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:7px;font-weight:600}
.fld input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);padding:0 16px;font-size:.95rem;outline:none;transition:.25s}
.fld input:focus{border-color:rgba(41,217,255,.6);box-shadow:0 0 0 3px rgba(41,217,255,.1),0 0 20px rgba(41,217,255,.15)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.8rem}
.row a{color:var(--muted);text-decoration:none}
.chk{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--cyan)}
.btn-main{width:100%;height:52px;border-radius:14px;border:none;background:var(--grad);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 8px 30px rgba(47,128,255,.45);transition:.25s}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(123,92,246,.55)}
.orline{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:.78rem;margin:22px 0}
.orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line)}
.socials{display:flex;gap:12px;margin-bottom:24px}
.sbtn{flex:1;height:48px;border-radius:13px;background:var(--glass);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:.88rem;cursor:pointer;transition:.25s}
.sbtn:hover{border-color:rgba(41,217,255,.5);transform:translateY(-2px)}
.foot-link{text-align:center;color:var(--muted);font-size:.88rem}
.foot-link a{color:var(--cyan);font-weight:600;text-decoration:none}
#msg{text-align:center;font-size:.85rem;margin-top:14px;min-height:20px}
#msg.ok{color:#7dffb0}#msg.bad{color:#ff9d9d}
@media(max-width:860px){.left{display:none}}
</style>
</head>
<body>
<div class="left">
  <div class="llogo"><span class="ic">✦</span> XonAI</div>
  <div class="lcenter">
    <div class="orbmini"><div class="r r2"></div><div class="r r1"></div><div class="o"></div></div>
    <h2>Better Learning<br><span>Brighter Future</span></h2>
    <p>Wapas aaye bhai — system ne tumhe miss kiya 😎🔥</p>
  </div>
  <div class="lfoot"><span><b>2M+</b> Students</span><span><b>50+</b> Features</span><span><b>4.9★</b> Rating</span></div>
</div>
<div class="right">
  <div class="fcard">
    <h1>Welcome Back</h1>
    <div class="sub">Sign In to continue your journey</div>
    <div class="fld"><label>Email or Username</label><input id="liEmail" type="email" placeholder="Enter your email"></div>
    <div class="fld"><label>Password</label><input id="liPass" type="password" placeholder="Enter your password"></div>
    <div class="row">
      <label class="chk"><input type="checkbox" checked> Remember me</label>
      <a href="#" onclick="forgot(event)">Forgot password?</a>
    </div>
    <button class="btn-main" id="liBtn" onclick="doLogin()">⚡ Sign In</button>
    <div id="msg"></div>
    <div class="orline">or continue with</div>
    <div class="socials">
      <button class="sbtn" onclick="demoSocial('Google')">G Google</button>
      <button class="sbtn" onclick="demoSocial('X')">𝕏 X</button>
    </div>
    <div class="foot-link">Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
</div>
<script>
const K=k=>'xonai-'+k;
function doLogin(){
  const e=liEmail.value.trim().toLowerCase(),p=liPass.value;
  const m=document.getElementById('msg');
  if(!e||!p)return m.className='bad',m.textContent='Dono field bhar bhai 😂';
  const users=JSON.parse(localStorage.getItem(K('users'))||'{}');
  const u=users[e];
  if(!u)return m.className='bad',m.textContent='Ye account nahi mila — pehle Sign Up karo!';
  if(u.pass!==btoa(p))return m.className='bad',m.textContent='Password galat hai — phir se try karo!';
  localStorage.setItem(K('profile'),JSON.stringify({name:u.name,class:'Student'}));
  m.className='ok';m.textContent='✅ Welcome back, '+u.name+'! Dashboard khol rahe hain...';
  liBtn.disabled=true;liBtn.textContent='Loading...';
  setTimeout(()=>location.href='dashboard.html',1200);
}
function forgot(ev){ev.preventDefault();const m=document.getElementById('msg');
  m.className='bad';m.textContent='🔒 Password reset Firebase ke saath aayega — abhi naya account bana lo ya purana yaad karo 😄';}
function demoSocial(w){const m=document.getElementById('msg');
  m.className='bad';m.textContent='🔐 '+w+' login Firebase ke saath aayega — abhi Email/Password use karo!';}
</script>
</body>
</html>
